<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Console</title>
    <script>
      // Pre-paint theme: last resolved mode (mirrored by ThemeProvider) or the OS
      // preference — kills the light-theme flash before React mounts.
      document.documentElement.dataset.theme =
        localStorage.getItem('nexus-theme') ??
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      try {
        const u = localStorage.getItem('nexus-ui-font');
        if (u && u !== 'default') {
          document.documentElement.style.setProperty(
            '--font-sans',
            `"${u}", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`,
          );
        }
        const m = localStorage.getItem('nexus-mono-font');
        if (m && m !== 'default') {
          document.documentElement.style.setProperty(
            '--font-mono',
            `"${m}", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`,
          );
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
